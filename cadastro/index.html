<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
</head>

<body>
    <h1>Cadastrar Cliente</h1>
    <hr>
    <form id="formCliente">
        <label for="">
            Nome:
            <input type="text" id="nome" required placeholder="Digite seu primeiro nome">
        </label>
        <br><br>

        <label for="sobrenome">
            Sobrenome:
            <input type="text" id="sobrenome" required placeholder="Digite seu sobrenome">
        </label>
        <br><br>

        <label for="email">
            E-mail:
            <input type="email" id="email" required placeholder="Digite seu email">
        </label>
        <br><br>

        <label for="telefone">
            Telefone:
            <input type="text" id="telefone" required minlength="11" maxlength="11"
                placeholder="Digite seu telefone com o DDD, ex: (xx) xxxxx-xxxx">
        </label>
        <br><br>

        <button type="submit">Salvar Dados</button>
        <hr>
    </form>
    <br><br>

    <div id="msg"></div>
    <br><br>

    <button id="listarClientes">Listar Clientes</button>
    <br><br>

    <input type="number" id="idExcluir" required placeholder="ID do cliente a ser excluído" hidden>
    <br>

    <button id="excluirCliente">Excluir Clientes</button>
    <button id="excluir" hidden
    >Excluir</button>
</body>

</html>
