<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="./favicons/favicon-16x16.png">

    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>

    <title>Pokedex</title>
</head>

<body>

    <main class="pokedex-card">

        <header class="pokedex-header">
            <span class="pokedex-light"></span>
            <h1 class="pokedex-title">Pokédex</h1>
        </header>

        <div class="pokedex-screen">
            <img src="./imagens/13940.gif" alt="pokemon" class="pokemon_image">
        </div>

        <p class="pokemon_data">
            <span class="pokemon__number"></span>
            <span class="pokemon__name"></span>
        </p>

        <form class="form">
            <input
            type="search"
            class="input_search"
            placeholder="Nome ou número"
            required
            />
        </form>

        <div class="buttons">
            <button class="button btn-prev">Prev &lt;</button>
            <button class="button btn-next">Next &gt;</button>
        </div>

    </main>

</body>

</html>
