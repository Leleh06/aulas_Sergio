<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
    <script defer src="index.js"></script>
    <title>Cadastro de Cliente</title>

</head>

<body>
    <h1>Cadastro de Cliente</h1>
    <hr>
    <br>

    <form id="formCliente">
        <label for="nome">
            Nome:
            <input type="text" id="nome" size="50">
        </label>
        <br><br>

        <label for="telefone">
            Telefone:
            <input type="text" id="telefone" minlength="10" maxlength="11">
        </label>
        <br><br>

        <label for="cpf">
            CPF:
            <input type="text" onblur="validarCPF()" id="cpf" minlength="11" maxlength="11"
                placeholder="somente número">
        </label>
        <br><br>

        <label for="nasc">
            Data de Nascimento:
            <input type="date" id="nasc">
        </label>
        <br><br>

        <label for="email">
            Email:
            <input type="email" id="email">
        </label>
        <br><br>




        <hr>
        <label for="endereco"><strong>
                <h3> Endereço:</h3>
            </strong>
        </label>
        <hr>
        <br>

        <label for="cep">
            CEP:
            <input type="text" id="cep" minlength="8" maxlength="8">
        </label>
        <br><br>

        <label for="nomeLog">
            Logradouro:

            <input type="text" id="nomeLog" disabled>
        </label>
        <br><br>



        <label for="bairro">
            Bairro:
            <input type="text" id="bairro" disabled>
        </label>
        <br><br>

        <label for="cidade">
            Cidade:
            <input type="text" id="cidade" disabled>
        </label>
        <br><br>

        <label for="numero">
            Número:
            <input type="text" id="numero">
        </label>
        <br><br>

        <label for="complemento">Complemento:</label>
        <input type="text" id="complemento" placeholder="informação complementar">
        <br><br>



        <label for="uf">
            UF(Unidade Federativa):
            <input type="text" id="uf" disabled>
        </label>
        <br><br>

        
        <button type="submit">Cadrastar</button>
    </form>

    <div id="msg"></div>

</body>

</html>
