<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
</head>

<body>
    <h1>Cadastro de Cliente</h1>
    <hr>
    <br>

    <form action="">
        <label for="nome">
            Nome:
            <input type="text" id="nome" required>
        </label>
        <br><br>

        <label for="telefone">
            Telefone:
            <input type="text" id="" required minlength="10" maxlength="11">
        </label>
        <br><br>

        <label for="nasc">
            Data de Nascimento:
            <input type="date" id="nasc">
        </label>
        <br><br>

        <label for="email">
            Email:
            <input type="email" id="email">
        </label>
        <br><br>

        <label for="">
            Endereço:
        </label>
        <hr>
        <br>

        <label for="">Logatura:

            <select id="log" required>
                <option value="">Escolha</option>
                <option value="rua">Rua</option>
                <option value="avenida">Avenida</option>
                <option value="servidao">Servidão</option>
                <option value="marginal">Marginal</option>
            </select>
        </label>
        <br><br>

        <label for="">
            Número:
            <input type="text">
        </label>

        <br><br>
        <label for="">
            Complemento:
            <input type="text">
        </label>
        <br><br>

        <label for="">
            Bairro:
            <input type="text">
        </label>
        <br><br>

        <label for="">
            Cidade:
            <input type="text">
        </label>
        <br><br>

        <label for="">
            UF(Unidade Federativa):

             <select id="uf" required>
                <option value="">Escolha</option>
                <option value="sc">SC</option>
                <option value="rs">RS</option>
                <option value="mt">MT</option>
                <option value="sp">SP</option>
                <option value="mg">MG</option>
            </select>
        </label>
        <br><br>

        <label for="">
            CEP:
            <input type="text" id="telefone" required minlength="8" maxlength="8">
        </label>
        <br><br>

        <button type="submit">Cadrastar</button>
    </form>

</body>

</html>
